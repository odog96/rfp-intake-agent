# Model routing — which provider and model each LLM role uses.
# Loaded by domain/model_routing.py. See docs/ARCHITECTURE.md §5.
#
# privacy_mode governs EGRESS and is enforced in code at provider construction
# (llm/provider.py), not merely honoured by the admin UI. It fails closed: an
# unknown provider, an unknown mode, or a role that has not opted in is an
# error, never a silent downgrade to the permissive path.
#
#   private  Only providers with `egress: none`. Document text never leaves the
#            environment. This is the default and the shipping posture.
#   mixed    External providers permitted, but ONLY for roles that additionally
#            set `allow_external: true`. Every other role still fails closed.
#   open     Any provider for any role.
#
# NOTE: every LLM role in this pipeline receives verbatim document excerpts.
# There is no role here that sees only metadata, so `mixed` and `open` both mean
# real document egress for whichever roles they cover — `mixed` only narrows
# WHICH documents leak, never whether they do. Use it for synthetic/eval corpora.

# Restored to `private` on 2026-08-26: the CAII Nemotron 3 Super 120B endpoint is
# live and passes scripts/smoke_caii.py. Nothing leaves the boundary in this mode
# — the Bedrock bindings below are commented out, not merely disabled.
# TEMPORARY 2026-08-27: `mixed` for a Bedrock comparison run against the CAII
# Nemotron results. Bedrock is testing-only per CLAUDE.md rule 5 — SYNTHETIC AND
# NON-SENSITIVE DOCUMENTS ONLY. Revert to `private` before any customer data.
privacy_mode: mixed

providers:
  caii:
    egress: none
    description: Cloudera AI Inference, in-environment. The strategic target.
    # Set here so models.yaml is the single source of truth for where a role
    # runs. Overrides RFP_INTAKE_CAII_BASE_URL; the credential still comes from
    # RFP_INTAKE_CAII_API_KEY / RFP_INTAKE_CAII_API_KEY_FILE, never from this file.
    base_url: https://ml-64288d82-5dd.go01-dem.ylcu-atmi.cloudera.site/namespaces/serving-default/endpoints/goes---nemotron-3-super-120b/v1
  mock:
    egress: none
    description: Deterministic fixtures. No network. Used by the test suite.
  litellm:
    egress: unverifiable
    description: >
      Local dev proxy. Routes to whatever the developer holds credentials for, so
      its destination cannot be verified from inside this process. Treated as
      external for privacy purposes — deliberately, because assuming otherwise is
      how customer documents reach a third party by accident.
  bedrock:
    egress: external
    description: AWS Bedrock. Off-box managed service, outside the customer boundary.

# `model` must match an id the provider actually serves — check with
# `python scripts/smoke_caii.py`, not by assumption.
#
# Nemotron 3 Super 120B, re-verified against the live endpoint 2026-08-27.
#
# THIS ENDPOINT HAS TOOL-CALLING DISABLED. A streaming request returns:
#   '"auto" tool choice requires --enable-auto-tool-choice and --tool-call-parser
#    to be set'
# Non-streaming requests do not error — they silently return plain text and no
# tool call, on all 9 extraction groups. So `strategy: native` cannot work here
# until the endpoint is redeployed with those two vLLM flags.
#
# `guided` (schema-in-prompt) is what actually works: the model returns correct,
# well-formed JSON as content. Server-side constrained decoding stays off — the
# endpoint ignores both vLLM's `guided_json` and NVIDIA's `nvext.guided_json`,
# and `response_format: json_schema`, which it does honour, degenerates into
# unbounded whitespace on the nested schemas domain/dynamic.py builds.
#
# Corrects a wrong reading on 2026-08-26 that pinned `native`: the smoke test's
# native rung was passing via StructuredOutput's guided fallback, not via a tool
# call. Re-test with allow_fallback=False before trusting a native result here.
#
# It is a reasoning model with no tool-call parser, so generation runs away on
# some groups — llm_max_tokens and llm_timeout_s in Settings are what stop that.
roles:
  # Bedrock access on this account is a narrow allowlist: only this model is
  # invokable. Claude models return ResourceNotFoundException until the Anthropic
  # use-case form is submitted in the console; Llama 3.3, Nova and Mistral are
  # denied outright by an org service control policy (p-dlt9r6fc).
  #
  # Verified 2026-08-27: tool-calling IS enabled on Bedrock, but this model still
  # answers long extraction prompts in prose and emits no tool call on 3 of 4
  # groups. Weak adherence, not a server flag — so `guided` here too.
  classify:
    provider: bedrock
    model: us.meta.llama3-1-70b-instruct-v1:0
    allow_external: true
    strategy: guided
  extract:
    provider: bedrock
    model: us.meta.llama3-1-70b-instruct-v1:0
    allow_external: true
    strategy: guided
  adjudicate:
    provider: bedrock
    model: us.meta.llama3-1-70b-instruct-v1:0
    allow_external: true
    strategy: guided

# Bedrock reference binding — testing on non-sensitive data only (CLAUDE.md rule 5).
# Requires privacy_mode: mixed and allow_external on each role. Only
# us.meta.llama3-1-70b-instruct-v1:0 is reachable on this account; that model
# answers long extraction prompts in prose and Bedrock rejects tool_choice for it,
# so it needs `strategy: guided`.
#
# roles:
#   extract:
#     provider: bedrock
#     model: us.meta.llama3-1-70b-instruct-v1:0
#     allow_external: true
#     strategy: guided
