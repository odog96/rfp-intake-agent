# Index sections: a table of contents, a list of tables, a glossary. These go
# whatever their text says, so `keep_if_contains` below does not apply to them.
#
# Their text *is* the document's own headings and definitions, so every rescue
# phrase appears in them by construction. On samples/Example protocol 2.pdf the
# contents page rescued itself with "Emergency Unblinding", the list of tables
# with "Schedule of Events" and the glossary with its definition of "case report
# form" — none of which is a fact about the study. They were on `set_aside`
# until tests/sections/test_set_aside_samples.py showed all three surviving.
#
# Same sources as the entries they replace: [01:05:16] for the contents page and
# [01:34:28] for the glossary and abbreviations.
always_set_aside:
  - table of contents
  - list of tables
  - list of figures
  - glossary
  - abbreviations
  - list of abbreviations
  - definitions
  - definition of terms

# A section whose heading is on `set_aside` is kept anyway when its text contains
# one of these phrases. Matching is case-insensitive, and reads the section's
# body only — not its heading, or "8.1 Emergency Unblinding" would rescue itself
# from its own title.
#
# This is the safety valve for docs/ANALYST_PROCEDURE_PROTOCOL.md section 5: the
# heading says the section is irrelevant, but one sentence inside it drives cost.
# Erring towards keeping is correct here — a kept section only costs tokens,
# while a wrongly dropped one costs a number nobody budgets for.
keep_if_contains:
  # Unblinded staff are a direct staffing cost, and the drug-storage section is
  # sometimes the only place the protocol admits they are needed [01:39:05, 01:40:30]
  # NOT `unblinding`: emergency unblinding is a procedure Angus ignores
  # [01:56:07] and it is on `set_aside` above, so the two entries contradicted
  # each other. `unblinded` is the cost driver — unblinded staff must be paid.
  - unblinded
  - blinded pharmacist
  - pharmacy staff

  # Interim analyses change the statistics workload [01:19:00, 01:59:05]
  - interim analysis
  - interim analyses

  # The schedule of activities is the single most important table in the
  # document and is sometimes in an appendix [02:03:39]
  - schedule of activities
  - schedule of events
  - schedule of assessments
  - schedule of procedures
  - study schedule
  - visit schedule

  - source data verification
  - source data review

# These rescue a section only when a number appears within 60 characters of the
# phrase. Angus's own wording: ignore "case report form details, unless the text
# gives a number of case report forms" [02:00:16]. A count can be budgeted;
# prose about how to complete a form cannot.
#
# Without the number test these four were the most destructive entries in the
# file. On samples/Example protocol 2.pdf the bare word "eCRF" appears in the
# adverse-event section, the treatment-compliance section and the glossary, and
# rescued all three.
keep_if_contains_with_number:
  - case report form
  - crf
  - ecrf
  - monitoring visit
  - monitoring visits
