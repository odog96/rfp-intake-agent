# Which protocol sections SET_ASIDE_SECTIONS drops before PLAN chooses what to read.
#
# Source of truth for this list: docs/ANALYST_PROCEDURE_PROTOCOL.md section 4,
# "Sections to ignore entirely", which records where Angus said so with a
# timestamp into the recording. Section 5 of the same document, "Sections to
# scan, not skip", is why `keep_if_contains` exists.
#
# Three rules govern this file, and all three come from docs/PLAN_2026-10-02.md
# stage 3:
#
# 1. Only remove what is positively on `set_aside`. Never keep an expected list
#    and drop everything else: an unfamiliar heading must survive, because a
#    heading nobody anticipated is exactly where an unbudgeted cost hides.
# 2. Matching is case-insensitive and ignores the section number, so "7.2
#    Inclusion Criteria" matches the entry `inclusion criteria`. An entry matches
#    when the heading contains it as a whole phrase, so `ethics` matches "Ethics"
#    and "Ethics Committee" but not "Bioethics". Some entries are therefore
#    already covered by a shorter one — `sample size` covers `sample size
#    calculation`, `ethics` covers `independent ethics committee`. They are kept
#    anyway, because each line traces to a specific instruction in
#    docs/ANALYST_PROCEDURE_PROTOCOL.md section 4 and deleting the longer form
#    would lose that. tests/domain/test_section_policy.py asserts the
#    redundancy is harmless rather than letting it drift into contradiction.
# 3. Setting a section aside also sets aside the sections nested under it, until
#    the next heading at the same or a higher level. So a heading here must be
#    safe to drop *with its children* — see the `statistical` note below.
#
# DELIBERATELY ABSENT: introduction, background, rationale.
# Section 4 of the analyst procedure does say to ignore them. They are left out
# anyway, because `study.phase` is wrong today precisely because of section 1.3.2
# of the sample protocol, which sits inside the background and describes a
# *different* study. Stage 4 (MARK_OTHER_STUDY) exists to find that text and
# remove it. If stage 3 dropped the whole background first, stage 4's live test
# would pass without MARK_OTHER_STUDY doing anything, and we would not know
# whether it works. Add them here only once stage 4 has passed on its own, which
# is the same ordering docs/PLAN_2026-10-02.md stage 5 item 1 applies to the
# `phase_population` search hints.

set_aside:
