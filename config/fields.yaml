# --- Group 9: Clinical Monitoring Requirements ------------------------------
  - id: monitoring.frequency_spec
    group: clinical_monitoring
    label: Requested monitoring frequency
    type: text
    scoped: true
    aliases: ["monitoring frequency", "every X weeks", "every X patients", "visit interval",
              "monitoring interval", "interim monitoring frequency"]
    # One row since 29 October 2026 (Angus Gray): "Specific monitoring frequency requested" is
    # gone, and the frequency is printed in the document's own words, not as a number of days
    # ("Approximately every 6 weeks", not "Every 42 days").
    hint: >
      How often the sponsor asks for the site's monitoring visits, copied in the document's own
      words with every condition it gives ("Approximately every 6 weeks or per every 1-2 subjects
      enrolled", "risk-based, triggered"). Do not convert units and do not calculate. Pharmacy
      monitoring visits have their own field, monitoring.pharmacy_frequency: leave their
      frequency out of this one. If the frequency differs by country, site tier, phase or
      cohort, emit one record per scope. Where the document says no frequency is set, use
      status not_specified.
    plain: >
      How often a monitor visits each site, as the sponsor asks.
    source_priority: rfp
    budget_driver: true

  - id: monitoring.source_data_expectations
    group: clinical_monitoring
    label: Source data monitoring expectations
    type: text
    aliases: ["SDV", "SDR", "source data verification", "source data review",
              "source document verification", "source document review", "100% SDV",
              "targeted SDV", "partial SDV", "reduced SDV", "percentage of CRFs",
              "data points verified"]
    # One variable since 29 October 2026 (Angus Gray): it replaces "Source data verification
    # expectations" and "Source data review expectations". Sponsors rarely give SDV and SDR
    # percentages apart, and the budget takes one percentage, so the tool looks for both and
    # reports what the document says, with no arithmetic.
    hint: >
      What the sponsor expects a monitor to check of the site's source records: source data
      verification (SDV), source data review (SDR), source data monitoring, or a percentage of
      CRFs, CRF pages or data points to be checked. Copy the document's words, with every
      percentage it gives, in one record: SDV and SDR together where the document gives both.
      Do not calculate, combine or convert percentages.
    plain: >
      How much of the site's own records a monitor checks against the study data: source data
      verification (SDV) compares them field by field, source data review (SDR) reads them for
      problems. Checking everything costs far more than a sample.
    source_priority: rfp
    budget_driver: true
    # Says what was looked for when nothing is found (Angus Gray, 7 October 2026: a row that
    # says nothing was specified should say what it refers to). It does not say the documents
    # are silent: "not found" can also mean the tool could not read the passage (rule 3).
    when_not_found:
      lines: ["The tool looked for source data verification (SDV), source data review (SDR) and CRF percentages."]

  - id: monitoring.strategy_guidance
    group: clinical_monitoring
    label: Monitoring strategy guidance / sponsor mandates
    type: text
    aliases: ["monitoring plan", "monitoring strategy", "sponsor requirements", "RBM",
              "risk-based monitoring", "quality tolerance limits"]
    # Live run r-20261123-oct29-run2 copied each monitoring visit type's count and time on
    # site here, which printed six rows repeating the five visit rows.
    hint: >
      Any sponsor-mandated monitoring model, restriction, or required visit type not captured
      by the more specific fields above. Monitoring here means the sponsor's or CRO's oversight
      of the sites. Leave out the number of visits and the time on site of site selection,
      initiation, interim monitoring, close-out and pharmacy monitoring visits: each has its own
      field. Instructions for measuring or handling subjects' samples (laboratory tests,
      drug or antibody levels) are not site monitoring: leave them out.
    source_priority: rfp
