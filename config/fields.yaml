      entry character for character, quote only the few words around the figure, as they appear.
      The value may read as one tidy sentence; the quote may not.
      Where the document says the sponsor will do site initiation visits itself, say that in the document's own
      words. Leave the field out only where no document mentions site initiation visits at all.
    plain: >
      Visits to start a site up once it has been chosen — training the site's staff and checking it
      is ready to enrol. Usually one per site, so the count follows the number of sites.
    source_priority: rfp
    budget_driver: true

