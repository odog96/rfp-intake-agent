# =============================================================================
# RFP Intake Agent — Field Registry
# =============================================================================
# SINGLE SOURCE OF TRUTH for what the tool extracts.
# Derived from Angus Gray's "RFP Review Tool - Key Variables" (9 groups).
#
# This file drives: extraction prompts, output schemas, page targeting,
# precedence, validation, and the report layout. Adding a variable is a YAML
# edit, not a code change. Every key below is load-bearing — see docs/ARCHITECTURE.md §4.
#
# FIELD KEYS
#   id             dotted, stable, never renamed once shipped (report columns key off it)
#   group          fan-out unit; one LLM call per (document × group)
#   label          human label used in the report and in the prompt
#   type           bool | enum | int | number | text | list[<type>] | object[]
#   values         allowed values when type=enum (validated in code, post-call)
#   aliases        alternative names as they appear in real documents.
#                  Angus explicitly asked for these — they feed both the prompt and page targeting.
#   hint           one line of instruction injected into the extraction prompt for this field
#   plain          one line of plain English for a reader without a clinical background.
#                  Printed in report.pdf — under the group heading for a group, and in the
#                  "Words used in this report" list for a field. NEVER sent to a model:
#                  `hint` is written for the extraction model, `plain` is written for the
#                  person reading the report, and the two must not be swapped.
#                  Optional. Omit it where the label is already plain ("Total number of sites").
#   scoped         true  => value may legitimately differ by cohort/arm/part/country.
#                  Extractor MUST emit one record per scope. Reconciler will NOT
#                  treat differing scopes as a contradiction.
#   source_priority which document kind wins when they disagree (ARCHITECTURE.md §4.6 rule 2)
#   budget_driver  true => directly moves the budget. Any disagreement is severity=high
#                  and forces needs_review. These are the fields the tool exists for.
#   derived        true => computed in DERIVE from other fields, never extracted directly
#   leave_out_scopes  derived fields only: `phrases` naming scopes whose input rows the rubric
#                  must not read, and the `reason` printed beside each row left out.
#                  A phrase matches when its words appear in the scope in order, ignoring
#                  case and punctuation. See ScopeLeftOut in domain/registry.py.
#   check_scopes_across_documents  true => each record's scope names what that part of the
#                  study is (for an arm, its treatment — the hint must ask for that), and
#                  RECONCILE matches scopes across documents on that name. A record whose own
#                  value and quote do not contain the name is not matched; a part only one of
#                  several documents lists is flagged for review. Not on derived fields.
#   follows_conflict_of  another field whose disagreement is this field's too. The report gives
#                  the row that disagreement's number and says report_wording.depends_on.
#   follow_wording with follows_conflict_of: `only_some` and `if_others_right`, the two sentences
#                  the row prints when only some documents in that disagreement give it a value.
#                  {docs}, {value}, {pages}: who gives it, what, where; {others}: the documents
#                  in the disagreement that give none. `if_others_right` is printed only when
#                  each of those documents' records gives one of `when_others_say` (stored
#                  values of the leading field). Never sent to a model.
#   display        how report.pdf lays out the variable's rows. `kind: scopes` puts every scope
#                  in one row with a heading each: `scopes` lists `phrases` (matched as in
#                  leave_out_scopes) and the `label` printed, in that order. Never sent to a model.
#   value_words    enum fields: the word report.pdf prints for a value, where the value's own
#                  spelling reads as software (`not_matching_stated`). Never sent to a model.
#
# GROUP KEYS
#   id             fan-out unit; one LLM call per (document × group)
#   label          group heading in the report
#   plain          one line of plain English under that heading (never sent to a model)
#   search_hints   headings/keywords PLAN scores each section against, and
#                  requires_tables
#   top_k          how many of the highest-scoring sections PLAN keeps for this
#                  group. Default 3. Raise it only for a group whose evidence is
#                  genuinely spread across more sections than that, and say in a
#                  comment which sections and which run measured it — every extra
#                  section is sent to the model on every run of every document.
#   block          several of the group's variables drawn as one row of report.pdf:
#                  `label`; `headline`, the variable whose value the row shows; `replaces`,
#                  the rows it takes out of the table (each stays in Appendix A and the
#                  review list); `lines`, one per variable, printed under the value with
#                  the report_wording `block_` sentences, or a line's own `wording` for a
#                  variable of another group ({doc}, {value}, {pages}). Never sent to a model.
#
# REPORT WORDING
#   report_wording phrases report.pdf prints that belong to no one field. Written for the
#                  person reading the report and NEVER sent to a model, like `plain`.
#                  `{n}` is replaced by the Disagreement number, `{value}` by the value shown,
#                  `{doc}` by the document precedence chose, `{why}` by a derived row's reasons
#                  and `{pages}` by the pages they rest on.
# =============================================================================

version: 1

report_wording:
  # Appendix A, under each passage behind a numbered Disagreement (CLAUDE.md open item 3).
  # On every passage stating the value the report shows, where precedence chose one:
  shown_provisional: "Shown in the report (provisional, by document precedence)"
  # On every other passage of that disagreement:
  not_used: "Not used — see Disagreement {n}"
  # On every passage, where precedence could not choose and the report shows no value:
  no_value_chosen: "No value chosen — see Disagreement {n}"
  # All variables, under the two sides of a disagreement on the variable's own row
  # (fix 2 of the 2026-10-12 brief). Where precedence chose a value:
  row_shown_provisional: "Shown provisionally: {value} (the {doc} normally takes precedence). See Disagreement {n}."
  # Where it did not:
  row_no_value_chosen: "No value chosen. See Disagreement {n}."
  # The status of a row that follows another variable's disagreement (follows_conflict_of):
  depends_on: "Depends on Disagreement {n}"
  # A derived row (`derived: true`), fix 8 of the same brief. Its status:
  derived_status: "Worked out by the tool — confirm"
  # Under its value, the rubric's reasons in plain words, then the pages they rest on:
  derived_why: "Why: {why}"
  evidence_pages: "Evidence pages: {pages}."
  # A group's `block` (fix 9), one line per variable under the block's value. A variable
  # with a quote, then one with none. `{cut}` is "…" after a quote cut short, outside the
  # quotation marks, and empty otherwise:
  block_stated: '{label}: {value} — "{quote}"{cut} ({pages})'
  block_value: "{label}: {value} ({pages})"
  # A variable the documents disagree about, then each document's side under it:
  block_disagree: "{label}: documents disagree (Disagreement {n})"
  block_side: '{pages}: "{quote}"{cut}'
  # A side resting on several passages, so with no one quote (each is in Appendix A):
  block_side_value: "{pages}: {value}"
  # A variable no document gives:
  block_not_found: "{label}: not found"
  # A scope's `<kind>:` prefix, as the design.parts hint defines the kinds (fix 11). A
  # prefix not listed here is printed as stored.
  scope_kind: "{kind}: {name}"
  scope_kinds:
    part: Part
    cohort: Cohort
    arm: Arm
    dose_level: Dose level
    treatment_group: Treatment group
  # The summary lines under an `entries` or `periods` display (fixes 1, 3 and 7 of the
  # 2026-10-12 brief). How many parts, `{kinds}` the display's `count` word:
  entries_count: "{n} {kinds}"
  # What every document listing the parts agrees on; `{docs}` is one of the next two:
  entries_agree: "{docs} agree on {what}."
  entries_two_docs: "Both documents"
  entries_all_docs: "All {n} documents"
  # A counted key with one value in every part, then one whose value differs by part:
  entries_same_each: "{value} {what} per {kind}"
  entries_each: "the {what} in each {kind}"
  # Keys only one document states, one key and then several:
  entries_only_one: "{what} is stated in the {doc} only."
  entries_only_many: "{what} are stated in the {doc} only."
  # How the summary joins the last two of its items:
  entries_and: " and "
  # A key the documents give different values for, each value with its pages:
  entries_differ: "{label}: documents differ — {values}"
  entries_differ_value: "{value} ({pages})"
  # Where the documents word a text key differently:
  other_wordings: "Other wordings are quoted in Appendix A."
  # Appendix A's marker on a passage the adjudicating reviewer said is not about the
  # variable (fix 5); the reviewer's reason is printed in Appendix B.
  off_topic: "Not about this variable — see Appendix B"

groups:
  - id: study_design
    label: Study Design and Structure
    plain: What kind of study this is, and how it is split into separate parts or groups.
    search_hints:
      headings: ["Study Design", "Overall Design", "Trial Design", "Synopsis", "Study Schema",
                 "Overview of Study Design", "Description of Study", "Study Parts", "Study Overview"]
      keywords: ["single-part", "multi-part", "Part A", "Part B", "cohort", "dose escalation",
                 "arm", "treatment group", "dose level", "first-in-human", "FIH",
                 "healthy volunteer", "healthy subject", "randomised", "randomized", "crossover",
                 "parallel group", "open-label", "double-blind", "sentinel dosing"]

  - id: phase_population
    label: Study Phase and Population
    plain: How far along the drug's development this study sits, and who takes part in it.
    search_hints:
      # NOT "Background" or "Rationale". Both were here until 2026-10-02 and both
      # pointed this group at section 1.3 of the sample protocol, whose subsection
      # 1.3.2 describes a *different* study — which is how `study.phase` came back
      # as phase_1_2. MARK_OTHER_STUDY now removes that text and
      # SET_ASIDE_SECTIONS drops the section, so these two hints were the third
      # copy of the same mistake. docs/PLAN_2026-10-02.md stage 5 item 1 held them
      # here until stage 4 had passed on its own, which it has twice.
      headings: ["Synopsis", "Study Phase", "Objectives", "Population", "Study Population",
                 "Inclusion Criteria", "Indication", "Title Page"]
      keywords: ["Phase I", "Phase 1", "Phase II", "Phase III", "Phase IV", "Phase 1/2",
                 "indication", "target population", "patients with", "subjects with",
                 "adult", "paediatric", "pediatric", "adolescent", "elderly"]

  - id: interim_analyses
    label: Interim Analyses and Decision Points
    plain: >
      Planned points where the results are looked at before the study ends, and a decision is
      taken about whether and how to carry on.
    search_hints:
      headings: ["Interim Analysis", "Statistical Considerations", "Statistical Methods",
                 "Data Monitoring Committee", "DMC", "DSMB", "Study Governance",
                 "Sample Size Re-estimation", "Adaptive Design"]
      keywords: ["interim analysis", "interim analyses", "IA", "futility", "efficacy boundary",
                 "sample size re-estimation", "DSMB", "IDMC", "SRC", "safety review committee",
                 "data review meeting", "dose escalation committee", "go/no-go", "stopping rule"]

  - id: treatment_dosing
    label: Treatment and Dosing
    plain: What the study drug is, how it is given to a participant, and how often.
    search_hints:
      headings: ["Investigational Product", "Study Drug", "Treatment", "Dosage and Administration",
                 "Study Treatments", "IMP", "Dosing Regimen", "Trial Medication", "Pharmacy Manual"]
      keywords: ["oral", "tablet", "capsule", "injection", "infusion", "subcutaneous", "SC",
                 "intravenous", "IV", "topical", "intramuscular", "IM", "QD", "BID", "TID",
                 "Q2W", "Q3W", "Q4W", "once daily", "twice daily", "every 3 weeks", "per cycle",
                 "loading dose", "maintenance dose", "titration"]

  - id: visits
    label: Subject Visit Schedule and Intensity
    plain: >
      How often a participant comes into the clinic and how much is done at each appointment.
      These are the participant's visits, not the monitor's visits to the site.
    search_hints:
      headings: ["Schedule of Events", "Schedule of Assessments", "Schedule of Activities", "SoA",
                 "Study Procedures",
                 "Visit Schedule", "Study Flow Chart", "Table of Assessments", "Study Calendar",
                 "Assessments", "Trial Procedures"]
      keywords: ["screening visit", "baseline", "Day 1", "Week 4", "follow-up visit",
                 "end of treatment", "EOT", "end of study", "long-term follow-up", "LTFU",
                 "visit window", "±3 days", "PK sampling", "pharmacokinetic", "biomarker",
                 "ECG", "imaging", "MRI", "CT scan", "safety labs", "questionnaire", "PRO",
                 "observation period", "unscheduled visit"]
      # SoA tables carry most of this group. INGEST must preserve them as structured rows.
      requires_tables: true
    # Addition 1 to stage 6 of the 2026-10-12 plan ranks a record from the schedule table
    # above a summary paragraph, which needs the table in the excerpt. Measured offline on
    # samples/Example protocol 2.pdf on 2026-10-13: with the default 3 and no "Schedule of
    # Events" heading hint PLAN kept PROTOCOL SYNOPSIS p11-26, Table 2 p82-83 and Appendix 3
    # p111-113, so "Table 1: Schedule of Events" p26-30 never reached the model; with the
    # hint and 3 it replaced the synopsis. 4 keeps all four. tests/plan/test_plan_sections_samples.py
    # fails if the table or the synopsis drops out.
    top_k: 4

  - id: timelines
    label: Study Timelines
    plain: How long the whole study runs, and how long each stage of it lasts.
    search_hints:
      headings: ["Study Duration", "Study Timelines", "Timeline", "Study Period", "Milestones",
                 "Recruitment", "Enrolment", "Enrollment", "Project Schedule", "Deliverables"]
      keywords: ["study duration", "first patient in", "FPI", "FPFV", "last patient out", "LPO",
                 "LPLV", "database lock", "DBL", "start-up", "startup period", "recruitment period",
                 "enrolment period", "screening period", "treatment period", "follow-up period",
                 "months", "weeks", "final analysis", "CSR"]

  - id: blinding_monitoring
    label: Blinding and Unblinded Monitoring
    plain: >
      Who is allowed to know which treatment a participant was given, and whether keeping that
      secret forces a second, separately staffed monitor onto the study.
    # One row for the question these six variables answer between them, whether unblinded
    # staff have to be paid for: as six rows they read as unconnected answers (fix 9 of the
    # 2026-10-12 brief). Each of the six stays in extraction.json, Appendix A and the review
    # list; the factors and the reason are in Appendix A only.
    block:
      label: Unblinded staff and monitoring
      headline: monitoring.unblinded_required
      replaces: [blinding.placebo_matching, blinding.unblinded_staff_stated,
                 monitoring.unblinded_required, monitoring.unblinded_factors,
                 monitoring.unblinded_rationale, blinding.placebo_assumption]
      lines:
        - field: blinding.unblinded_staff_stated
          label: Stated in the documents
        - field: blinding.placebo_matching
        - field: blinding.placebo_assumption
        - field: ops.visits_pharmacy_monitoring
          wording: "{doc} asks for pharmacy monitoring visits: {value} ({pages})."
    search_hints:
      # "Placebo" as a heading and "placebo"/"matching" as keywords are what make protocol
      # section "6.3 Placebo" reachable. Before 2026-10-02 that section scored 0.000 for this
      # group, so PLAN never sent it and EXTRACT never saw "A matching placebo will not be
      # provided for this study." — the one sentence blinding.placebo_matching depends on.
      headings: ["Blinding", "Randomisation and Blinding", "Unblinding", "Treatment Allocation",
                 "IP Accountability", "Pharmacy Manual", "Drug Accountability", "Monitoring Plan",
                 "Placebo"]
      keywords: ["open-label", "single-blind", "double-blind", "triple-blind", "blinded",
                 "unblinded", "unblinded monitor", "unblinded pharmacist", "unblinded site staff",
                 "emergency unblinding", "IWRS", "IXRS", "randomisation code", "drug preparation",
                 "treatment allocation", "IP accountability", "placebo", "matching"]
    # 7, not the default 3, measured on samples/Example protocol 2.pdf on 2026-10-03.
    # This group's evidence is four sections lying on three pages, and at 3 the
    # heading "Placebo" added above won the top three and *evicted* two of them —
    # blinding.unblinded_staff_stated fell from four records to one and GATE
    # confirmed the wrong answer at 0.85, which is worse than the needs_review it
    # replaced. Ranked by score, the sections this group needs are:
    #   2. 6.3 Placebo                     p53     "A matching placebo will not be provided"
    #   4. 5 SUBJECT SCREENING AND RANDOM. p52-53  "Unblinded Pharmacist or their designee"
    #   7. 6.2 Shipping, Storage, Handling p53     "limited to the unblinded pharmacy staff"
    # with the title page (1) and PROTOCOL SYNOPSIS (3) scoring above them and
    # 6.5.1 Study Drug (5) between. 7 is the smallest value that reaches all three
    # sentences; it costs this group a 45,601-character excerpt against 34,760 at 3.
    # Lowering it back to 3 will fail tests/plan/test_plan_sections_samples.py.
    top_k: 7

  - id: operational_metrics
    label: Operational Metrics and Volumes
    plain: >
      The counts a budget is built from: how many hospitals or clinics, how many participants,
      how many forms, how many monitoring visits.
    search_hints:
      headings: ["Number of Sites", "Number of Subjects", "Sample Size", "Countries",
                 "Scope of Work", "Assumptions", "Budget Assumptions", "Study Scope",
                 "Study Overview", "CRF", "Data Management", "Site Distribution"]
      keywords: ["number of sites", "investigative sites", "number of subjects", "number of patients",
                 "planned enrolment", "sample size", "screen failure rate", "CRF pages", "eCRF pages",
                 "unique CRF", "SSV", "site selection visit", "SIV", "site initiation visit",
                 "IMV", "interim monitoring visit", "COV", "close-out visit", "pharmacy visit",
                 "booster visit", "remote monitoring", "centralised monitoring", "co-monitoring",
                 "site qualification visit", "pharmacy monitoring", "time on site"]
      requires_tables: true

  - id: clinical_monitoring
    label: Clinical Monitoring Requirements
    plain: >
      How often the sponsor expects someone to visit each site to check the work, and how much of
      the recorded data that person has to check against the site's own records.
    search_hints:
      headings: ["Monitoring", "Clinical Monitoring", "Monitoring Plan", "Site Monitoring",
                 "Source Data Verification", "Risk Based Monitoring", "Quality Management",
                 "Scope of Work", "Sponsor Requirements", "Sponsor Oversight"]
      keywords: ["monitoring frequency", "every 6 weeks", "every 8 weeks", "risk-based monitoring",
                 "RBM", "SDV", "source data verification", "SDR", "source data review",
                 "100% SDV", "targeted SDV", "on-site monitoring", "remote monitoring",
                 "monitoring visit frequency", "triggered visits", "centralised monitoring"]

# =============================================================================
fields:

# --- Group 1: Study Design and Structure ------------------------------------
  - id: design.overview
    group: study_design
    label: General study design / structure
    type: text
    aliases: ["study design", "overall design", "trial design", "study schema", "design summary"]
    hint: >
      Brief factual overview of the overall design. State the design type (e.g. randomised,
      double-blind, placebo-controlled, dose-escalation, crossover), and whether the study is
      single-part or multi-part. 2-4 sentences maximum, drawn only from the document.
    source_priority: protocol

  - id: design.is_multipart
    group: study_design
    label: Multi-part study
    type: bool
    aliases: ["single-part", "multi-part", "study parts", "Part A / Part B", "stages"]
    hint: True if the study is explicitly divided into parts, stages, or phases of conduct.
    source_priority: protocol
    budget_driver: true

  - id: design.parts
    group: study_design
    label: Cohorts / arms / dose levels / parts
    type: object[]
    schema:
      name: text            # "Part A", "Cohort 3", "NEOD001 plus standard of care"
      kind: enum[part, cohort, arm, dose_level, treatment_group]
      document_label: text  # the document's own name for it: "Group 1", "Arm A"
      dose: text            # "24 mg/kg IV infusion"
      schedule: text        # "every 28 days"
      description: text
      start_trigger: text   # "after DLT review of Cohort 2" — capture when it starts if stated
      n_subjects: int
    aliases: ["cohort", "arm", "dose level", "treatment group", "study part", "stage", "expansion cohort"]
    # The scope rule in the hint, check_scopes_across_documents and the step-3 check behind it
    # were approved by Oliver on 2026-10-12. Before it, run r-20261009-225414 listed four arms
    # for a two-arm study: the protocol amendment's arms scoped "arm:NEOD001" and
    # "arm:Placebo", the RFP's scoped by their labels "arm:Group 1" and "arm:Group 2". A label
    # says nothing about which arm it is, so the scope names the treatment instead, and a
    # control arm by its role ("placebo"), never its substance ("normal saline"). The last
    # sentence of the hint is Oliver's correction of 2026-10-12: run r-20261012-stage4check2
    # put the placebo arm's "normal saline IV infusion once every 28 days" in `description`,
    # so the placebo arm printed no dose line.
    hint: >
      One entry per distinct cohort, arm, dose level, treatment group or study part.
      Capture the stated start condition/timing for each, if given. Do not invent structure that
      the document does not state.
      Set `scope` on every entry. For a treatment arm, name the arm by what its subjects
      receive, as the document names it: scope="arm:<study drug>". Never use the arm's number,
      letter or group name ("Arm 1", "Group A") as the scope, and leave out background therapy
      that every arm receives. Name a control arm by its role as the document names it, such
      as "arm:placebo", "arm:standard of care alone" or "arm:active comparator: <drug>" — never
      by its substance ("normal saline", "vehicle"). Put the dose in the scope only when the
      study's arms differ by dose. A study part or a dose-escalation cohort keeps its own name,
      such as scope="part:Part A" or scope="cohort:Cohort 3".
      In raw_value, `name` is what the part is, as the document names it ("NEOD001 plus
      standard of care", "Part A"); `document_label` is the document's own number, letter or
      group name for it ("Group 1", "Arm A"), only where it gives one; `dose` is the dose and
      how it is given ("24 mg/kg IV infusion") and `schedule` how often ("every 28 days"), each
      only as the document states it for this part; `n_subjects` is the number of subjects in
      this part alone, never the study's total. A control arm's dose and schedule go in `dose`
      and `schedule` like any other arm's, also when the control is a placebo ("normal saline
      IV infusion", "every 28 days"); `description` never holds a dose or a schedule.
    plain: >
      The separate groups a study splits into: an arm is one treatment being compared, a cohort a
      group dosed together, a dose level one strength tested. Each one adds work.
    source_priority: protocol
    budget_driver: true
    check_scopes_across_documents: true
    # Fix 1 of the 2026-10-12 brief, approved by Oliver: where every document lists the
    # same arms and agrees on each arm's counted keys, the list is one answer and GATE
    # may confirm it, instead of reviewing it as a budget driver with several values.
    one_answer_when_documents_agree: true
    # Keys that only name or describe the arm, which documents word differently ("NEOD001 +
    # SoC"). A dose, schedule or start two documents both state must read the same.
    may_word_differently: [name, document_label, description]
    # One block of lines per arm, its keys merged across the documents
    # (reconcile/entries.py), and under them what the documents agree on.
    display:
      kind: entries
      title: ["{kind} {n} — {name}", "{n} — {name}", "{kind} {n}"]
      kind_key: kind
      count:
        part: parts
        cohort: cohorts
        arm: arms
        dose_level: dose levels
        treatment_group: treatment groups
        mixed: groups
      headline_fields:
        - field: design.allocation_ratio
          wording: "randomized {value}"
      lines:
        - ["Dose: {dose}, {schedule}", "Dose: {dose}", "Schedule: {schedule}"]
        - ["Subjects: {n_subjects}"]
        - ["Starts: {start_trigger}"]
      label_key: document_label
      label_line: "{doc} calls it: {value}"
      key_words:
        n_subjects: subjects
        dose: dose
        schedule: schedule

  - id: design.allocation_ratio
    group: study_design
    label: Allocation ratio
    type: text
    aliases: ["randomized 1:1", "randomised 1:1", "randomization ratio", "allocation ratio"]
    # Added 2026-10-12 (fix 1 of that day's brief, decided by Oliver). It has no row of its
    # own: "Cohorts / arms / dose levels / parts" prints it in its headline ("2 arms,
    # randomized 1:1"), and its passages stay in Appendix A.
    hint: >
      The ratio in which subjects are randomized to the arms, as the document states it, such
      as "1:1" or "2:1". Only the ratio.
    plain: >
      How subjects are split between the arms when they are randomized: 1:1 means equal numbers.
    source_priority: protocol

  - id: design.first_in_human
    group: study_design
    label: First-in-human
    type: enum
    values: [yes, no, not_specified]
    aliases: ["first-in-human", "FIH", "FIM", "first-in-man", "first administration to humans"]
    hint: Only "yes" if the document explicitly describes the study or compound as first-in-human.
    plain: >
      Whether the drug has never been given to a person before. If so, safety monitoring is much
      heavier and the first doses go to one person at a time.
    source_priority: protocol
    # A Phase 2, 3 or 4 study is never first-in-human: by the time a drug reaches
    # Phase 2 it has already been given to people in Phase 1. Angus Gray stated
    # the rule on the 2026-10-07 call (transcript 00:29-00:32) — answer No, full
    # confidence, no passage needs to be searched for. Phase 1 and Phase 1/2 are
    # deliberately absent: those are the studies that do need checking, and they
    # are extracted as before.
    resolution_rules:
      - when_field: study.phase
        when_value_in: [phase_2, phase_2_3, phase_3, phase_3_4, phase_4]
        value: no
        confidence: 1.0
        because: >
          A Phase 2, 3 or 4 study is never first-in-human: the drug has already been
          given to people in an earlier phase. Read from the study phase, not from a
          passage about first-in-human status.

  - id: design.healthy_volunteers
    group: study_design
    label: Healthy volunteers included
    type: enum
    values: [yes, no, not_specified]
    aliases: ["healthy volunteer", "healthy subject", "HV", "normal healthy volunteer", "NHV"]
    hint: >
      "yes" only where the document says healthy people take part. WHEN THE ANSWER IS "no", THE
      QUOTE MUST BE THE PHRASE THAT NAMES THE PATIENT POPULATION — for example "subjects with light
      chain (AL) amyloidosis". A protocol almost never says "no healthy volunteers" in so many
      words, so a "no" with no quote, or a quote that merely fails to mention healthy volunteers, is
      not evidence of anything. Use "not_specified" where the document names no population at all.
    plain: >
      Whether some participants are healthy people rather than patients who have the disease being
      treated. Healthy-volunteer groups are usually run at different sites.
    source_priority: protocol

  - id: design.healthy_volunteer_scope
    group: study_design
    label: Which cohort/part includes healthy volunteers
    type: text
    hint: Only populate if design.healthy_volunteers is yes and the document names the cohort or part.
    source_priority: protocol

# --- Group 2: Study Phase and Population ------------------------------------
  - id: study.phase
    group: phase_population
    label: Study phase
    type: enum
    values: [phase_1, phase_1_2, phase_2, phase_2_3, phase_3, phase_3_4, phase_4, not_specified, other]
    aliases: ["Phase I", "Phase 1", "Ph I", "Phase Ib", "Phase I/II", "Phase 1/2", "Phase IIa", "Phase IIb"]
    hint: >
      Map to the closest enum value. "Phase Ib" -> phase_1. "Phase IIa"/"Phase IIb" -> phase_2.
      Combined phases map to the combined enum. Record the verbatim phase text in raw_value.
    plain: >
      How far along the drug's testing this study is. Phase 1 is the earliest and smallest; Phase 3
      is the large study that supports approval.
    source_priority: protocol
    budget_driver: true

  - id: study.population
    group: phase_population
    label: Patient / subject population
    type: text
    aliases: ["study population", "target population", "subject population", "patient population",
              "eligible subjects"]
    hint: >
      WHO ACTUALLY TAKES PART IN THIS STUDY — not the disease the drug is for. That is
      study.indication, a separate field. The two are often the same and sometimes are not: a new
      headache drug has the indication "acute headache", but its first study may give it to healthy
      people who do not have a headache, so that the drug's side effects are not mistaken for
      headache symptoms. There the population is "healthy volunteers" and the indication is "acute
      headache". State the population in one or two sentences (e.g. "adults 18-75 with moderate to
      severe ulcerative colitis who have failed conventional therapy"). Do NOT enumerate the full
      inclusion/exclusion criteria list — Angus has flagged that as out of scope.
      The analysis populations of the statistics section (intent-to-treat, ITT, safety,
      per-protocol, full analysis set) are not the study population: they say which subjects'
      data an analysis uses, not who takes part. Leave them out, and leave scope empty.
    plain: >
      Who takes part in this study. Not the same question as which disease the drug is for: an early
      study of a headache drug may be run in healthy people who have no headache.
    source_priority: protocol

  - id: study.indication
    group: phase_population
    label: Disease type / indication
    type: text
    aliases: ["indication", "disease", "therapeutic area", "condition", "disease under study"]
    hint: >
      THE DISEASE THE DRUG IS MEANT TO TREAT — not who takes part in this study. That is
      study.population, a separate field. A new headache drug has the indication "acute headache"
      even when its first study is run in healthy people without headaches. State the disease, not
      the eligibility criteria.
    plain: >
      The disease the drug is meant to treat. Not the same question as who takes part in this
      study — see the population field above.
    source_priority: protocol

  - id: study.primary_objective
    group: phase_population
    label: Primary objective
    type: text
    aliases: ["primary objective", "primary aim", "objective", "primary study objective"]
    hint: >
      Copy the primary objective VERBATIM, as the document writes it, in one record. Do not
      summarise it, do not shorten it and do not merge several objectives into one. If the document
      numbers or labels it ("Primary Objective", "1.1"), take the text under that label only. Where
      the synopsis and the body state it in different words, prefer the body and note the synopsis
      wording in `notes`. Secondary and exploratory objectives are out of scope and are set aside.
    plain: >
      What this study is mainly trying to find out, in the document's own words. Angus asked for it
      written out rather than summarised, so that the report can be read beside the protocol.
    source_priority: protocol

# --- Group 3: Interim Analyses ----------------------------------------------
  # `interim.planned` — "Interim analyses planned", yes or no — was removed on
  # 2026-10-07 at Angus Gray's request (change 4 of that day's review). A count
  # of 0 already says none are planned, and two rows answering the same question
  # side by side is how run r-20261007-140411 came to show "Interim analyses
  # planned: No" next to "Number of interim analyses: 1", with the disagreement
  # flagged on the yes/no row and the count confirmed. The count carries the
  # question now, and the hint below is what makes an explicit "no interim
  # analyses are planned" come back as 0 rather than as nothing found.
  - id: interim.count
    group: interim_analyses
    label: Number of interim analyses
    type: int
    aliases: ["interim analysis", "interim analyses", "IA", "planned interim"]
    hint: >
      How many formal interim analyses are planned. Only if explicitly stated or unambiguously
      enumerable from the document. WHERE THE DOCUMENT STATES THAT NO INTERIM ANALYSES ARE
      PLANNED — "no interim analyses are planned for this study", "no formal interim analysis will
      be performed" — THE ANSWER IS 0, with that sentence as the quote. 0 is a real answer and is
      not the same as finding nothing: leave the field out only where the document does not say.
      Formal planned interim analyses only. A DSMB/IDMC safety review is NOT automatically an
      interim analysis — capture it only if the document frames it as one, and note the distinction
      in `notes`.
    plain: >
      How many times the results are formally analysed before the study ends, to decide whether to
      carry on. Each analysis needs its own data cut, statistics and committee meeting. 0 means
      none are planned.
    # Angus: this can appear in EITHER document. No blanket protocol precedence.
    source_priority: any
    budget_driver: true

  - id: interim.timing
    group: interim_analyses
    label: Timing of each interim analysis
    type: list[text]
    aliases: ["after N events", "when X% enrolled", "after N subjects complete"]
    hint: One entry per interim analysis, describing when it is expected to occur.
    source_priority: any
    # When the documents disagree about how many interim analyses there are, they
    # disagree about this row too, and this row cannot see it: RECONCILE never
    # compares a list across documents (reconcile/__init__.py _merge_collection),
    # so one document's timing was shown as Confirmed in run r-20261007-140411
    # while the count beside it was in dispute. Change 4 of that review.
    follows_conflict_of: interim.count
    # Fix 2 of the 2026-10-12 brief: the amendment says 0 interim analyses and the
    # RFP 1, and only the RFP times one, so the timing row says that. The second
    # sentence is true only where the other document's count is 0.
    follow_wording:
      only_some: "Only the {docs} gives a timing: {value} ({pages})."
      if_others_right: "If the {others} is right, there is no interim analysis to time."
      when_others_say: ["0"]

# --- Group 4: Treatment and Dosing ------------------------------------------
  - id: ip.form
    group: treatment_dosing
    label: Investigational product / drug form
    type: list[enum]
    values: [oral_tablet, oral_capsule, oral_solution, injection_sc, injection_im, infusion_iv,
             topical, inhaled, intrathecal, ophthalmic, other, not_specified]
    value_words:
      oral_tablet: Oral tablet
      oral_capsule: Oral capsule
      oral_solution: Oral solution
      injection_sc: Subcutaneous injection
      injection_im: Intramuscular injection
      infusion_iv: IV infusion
      topical: Skin application
      inhaled: Inhalation
      intrathecal: Intrathecal injection (into the spinal fluid)
      ophthalmic: Eye application
      other: Another route
    aliases: ["IP", "IMP", "study drug", "investigational product", "test article", "study medication"]
    hint: >
      Multiple forms allowed (e.g. IV loading dose then SC maintenance). Route of administration
      determines the form for injectables. Use `other` with a note for anything unlisted.
      Quote the sentence that states the route ("administered by intravenous infusion"), not
      one that only names the drug.
    # Fix 11 of the 2026-10-12 brief: run r-20261012-angus read an IV infusion from RFP p.1,
    # which names only an antibody. A record giving infusion_iv with a quote saying none of
    # these words is rejected by EXTRACT (extract/validate.py:answers_field).
    quote_must_say:
      infusion_iv: [IV, intravenous, intravenously, infusion, infusions, infused]
    plain: >
      How the drug gets into the body — a tablet, an injection under the skin, a drip into a vein.
      A drip ties up a clinic room and a nurse for hours; a tablet does not.
    source_priority: protocol
    budget_driver: true

  - id: dosing.frequency
    group: treatment_dosing
    label: Dosing frequency / schedule
    type: text
    scoped: true
    aliases: ["QD", "BID", "TID", "QW", "Q2W", "Q3W", "Q4W", "once daily", "twice daily",
              "every 2 weeks", "every 3 weeks", "per cycle", "dosing regimen", "dosing schedule"]
    hint: >
      Capture the schedule as stated. If dosing differs by cohort, arm, dose level or part,
      emit ONE RECORD PER SCOPE with scope set (e.g. scope="cohort:Part B"). Never average
      or merge differing regimens into one answer.
    source_priority: protocol
    budget_driver: true

  - id: dosing.varies_by_cohort
    group: treatment_dosing
    label: Dosing differs by cohort/arm/part
    type: enum
    values: [yes, no, not_specified]
    source_priority: protocol

# --- Group 5: Visit Schedule and Intensity ----------------------------------
  - id: visits.frequency_by_period
    group: visits
    label: Visit frequency by study period
    type: object[]
    schema:
      # The fixed list of periods Oliver approved on 2026-10-12, after run
      # r-20261012-stage4check2 printed 21 lines, one per document label.
      period: enum[screening, early_treatment, later_treatment, end_of_treatment, follow_up,
                   stopped_early]
      label: text            # the stretch as the document names it: "Months 1–3"
      frequency: text        # "weekly for 4 weeks, then every 4 weeks"
      n_visits: int          # only where the document states the number
    scoped: true
    aliases: ["schedule of assessments", "SoA", "schedule of activities", "visit schedule",
              "study flow chart", "study calendar"]
    # The exclusions and stopped_early are fix 3 of the 2026-10-12 brief: run
    # r-20261012-angus mixed the schedule's rows with questionnaire subgroups, the visits of
    # subjects who stopped early, and the RFP's monitoring visits. ANALYST_PROCEDURE_PROTOCOL.md
    # section 9: subjects who stopped early are never added to the main periods. The
    # exclusions were already in this hint, which the model reads, and run
    # r-20261012-stage4check2 still returned questionnaire timing and the RFP's site
    # qualification visits, so they are spelled out below (Oliver, 2026-10-12).
    hint: >
      Read the Schedule of Assessments table where present — it is the authoritative source.
      One entry per period of the study, `period` being one of: screening (before the first
      dose); early_treatment (the first stretch of treatment, while visits are most frequent,
      or the whole of treatment when its visit pattern never changes); later_treatment
      (treatment after visits become less frequent); end_of_treatment (the end-of-treatment
      visit); follow_up (visits after treatment ends as planned); stopped_early (visits of a
      subject who stops treatment early). `label` names the stretch as the document does
      ("Screening", "Months 1–3", "Month 4 onwards"). `frequency` says how often the subject
      visits and on which days, in the document's words, covering every visit pattern within
      the period, such as a larger visit every third month; `n_visits` only where the document
      states the number. Visits after a subject stops treatment early go under period
      stopped_early, never under the main periods.
      Only the subject's own clinic visits. Leave out the timing of questionnaires, scales and
      other assessments, even where a table of them lists visits or differs by subgroup: they
      say what is done at a visit, not when the subject comes. Leave out visits to the site by
      the sponsor's or CRO's staff — site selection, qualification, initiation, monitoring,
      pharmacy and close-out visits — which are separate variables.
      Leave scope empty unless the schedule differs by arm, cohort or part, and then emit one
      record per scope, named as for design.parts.
    plain: >
      How often a participant attends the clinic at each stage of the study. These are the
      participant's appointments, not the monitor's visits to the site.
    source_priority: protocol
    budget_driver: true
    # One row, a line per period in the order of `period`'s values (fix 3), the
    # document's own label beside the period where the two differ.
    # Addition 1 to stage 6 of the 2026-10-12 plan: a record read from the schedule table
    # outranks a summary paragraph of the same document, whatever their confidence. The
    # heading is the section EXTRACT read the quote from.
    prefer_sections: ["schedule of events", "schedule of activities", "schedule of assessments",
                      "study flow chart"]
    display:
      kind: periods
      order_key: period
      one_per: [period]
      heading: ["{period} ({label})", "{period}"]
      lines: ["{heading}: {frequency}", "{heading}: {n_visits} visits"]
      notes:
        stopped_early: "(budgeted separately)"

  - id: visits.total_count
    group: visits
    label: Total number of subject visits
    type: int
    scoped: true
    hint: >
      Only if stated or directly countable from the Schedule of Assessments. Do not estimate.
      If the document gives no total because the number of visits differs from subject to
      subject (for example, visits continue for as long as each subject stays on treatment, or
      until an event), give the sentence that says so instead: status "not_specified", scope
      "why no total", that sentence as the quote.
    source_priority: protocol
    budget_driver: true
    # Fix 4 of the 2026-10-12 brief. The reason line is the document's own sentence, from a
    # record scoped "why no total"; where the model gives none, it is left out.
    when_not_found:
      lines: ["No document gives a total."]
      because_scopes: ["why no total"]
      see: [visits.frequency_by_period]

  - id: visits.schedule_present
    group: visits
    label: Schedule of activities present
    type: enum
    # `"no"` is quoted. Unquoted, YAML reads it as the boolean false, and the
    # registry would hand the model the enum `yes_body | yes_appendix | false`
    # beside two string values — see the note on
    # `blinding.unblinded_staff_stated` below.
    values: [yes_body, yes_appendix, "no"]
    aliases: ["schedule of activities", "schedule of events", "schedule of assessments", "SoA",
              "SoE", "study flow chart", "study calendar", "table of assessments"]
    hint: >
      Whether a schedule of activities exists in this document and WHERE. "yes_body" when the table
      sits in the numbered body of the document; "yes_appendix" when it sits in an appendix or
      attachment, which is common and is where Angus says to look when the body has none; "no" when
      the document has no such table at all. A contents-page entry or a cross-reference to a table
      that is not in this document is not the table: answer "no" and say so in `notes`. The quote
      must be the table's own heading or caption, not a mention of it elsewhere.
    plain: >
      Whether the document contains the grid showing what happens at each appointment, and whether
      it is in the main text or tucked into an appendix. It is the single most useful table for
      working out how much a study costs.
    source_priority: protocol
    budget_driver: true

  - id: visits.intensity_evidence
    group: visits
    label: Evidence of visit intensity
    type: list[enum]
    values: [multiple_assessments_per_visit, long_visit_windows, complex_procedures,
             pk_pd_sampling, biomarker_sampling, imaging, ecgs, safety_labs, questionnaires,
             infusion_observation_period, frequent_early_visits, overnight_stay, none_found]
    # The phrases the visit intensity rating's "Why" line is built from (fix 8 of
    # the 2026-10-12 brief), and the words this row prints.
    value_words:
      multiple_assessments_per_visit: Several assessments per visit
      long_visit_windows: Long visit windows
      complex_procedures: Complex procedures
      pk_pd_sampling: PK/PD sampling
      biomarker_sampling: Biomarker samples
      imaging: Imaging
      ecgs: ECGs
      safety_labs: Safety labs
      questionnaires: Questionnaires
      infusion_observation_period: IV infusion with an observation period
      frequent_early_visits: Frequent visits early in the study
      overnight_stay: Overnight stay
      none_found: None found
    hint: >
      Flag each factor the document provides concrete evidence for. This feeds the derived
      intensity rating — each flag must have its own quote.
    plain: >
      What the document names that makes an appointment long or demanding: repeated blood sampling,
      scans, heart tracings, an overnight stay. These drive the rating below.
    source_priority: protocol

  - id: visits.intensity_rating
    group: visits
    label: Subject visit intensity
    type: enum
    values: [low, moderate, high, not_specified]
    derived: true
    derived_from: [visits.intensity_evidence, visits.frequency_by_period, visits.total_count]
    hint: >
      DERIVED — computed by the rubric in ARCHITECTURE.md §4.8, never extracted by the model.
      The report must show the contributing evidence alongside the rating so a reviewer can
      disagree with it.
    plain: >
      A low / moderate / high rating of how demanding each appointment is. No document states this:
      the tool works it out from the procedures it found, so it is a starting point, not a fact.
    budget_driver: true
    # The rating combines every row of its inputs except those about patients who
    # stopped treatment early. docs/ANALYST_PROCEDURE_PROTOCOL.md section 9: their
    # separate follow-up schedule must not be added to the main count, because
    # IQVIA budgets dropouts separately. Narrower rows about the main patients,
    # such as "Months 1-3", still count. Approved by Oliver on 2026-10-11.
    #
    # The phrases name the patients or the time after they stop, never the
    # "End of Treatment / Early Treatment Discontinuation" visit on its own:
    # every patient has that visit, completers included, so it belongs to the
    # main schedule. That is why bare "early termination" and "early treatment
    # discontinuation" are not here — "End of Treatment / Early Termination" is
    # how the synthetic pair names that visit. The phrases were chosen against
    # every scope written in runs/ up to r-20261011-fix1.
    #
    # Known edge: "early discontinuation" is kept bare because scopes such as
    # "Early discontinuation (Appendix 3): Months 3-12" need it, but it would
    # also hold back a scope worded "End of Treatment / Early Discontinuation
    # visit". No run has written that wording; if one does, the note names the
    # row, so a reviewer will see it.
    leave_out_scopes:
      reason: >
        it is about patients who stopped treatment early, whose visits follow a separate schedule
        that is budgeted apart from the main count
      phrases:
        - early discontinuation
        - early discontinuers
        - early drug discontinuation
        - early treatment discontinuation subjects
        - etd subjects
        - early termination subjects
        - discontinue study drug
        - discontinued study drug
        - discontinuing study drug
        - stopped treatment early
        - post etd
        - post discontinuation

# --- Group 6: Study Timelines -----------------------------------------------
  - id: timeline.total_duration
    group: timelines
    label: Overall study duration
    type: text
    aliases: ["study duration", "total duration", "overall duration", "study period",
              "duration of participation"]
    hint: >
      Distinguish OVERALL STUDY duration (first patient in to database lock) from PER-SUBJECT
      duration (an individual's time on study). If both are present, emit both with
      scope="study" and scope="subject" respectively. Conflating them is a known failure mode.
    source_priority: any
    budget_driver: true
    # One row, the whole study first: as two rows, a confirmed "subject" row sat above the
    # disagreement on study length and read as settling it (Angus Gray, 2026-10-12).
    display:
      kind: scopes
      scopes:
        - phrases: ["study"]
          label: Whole study
        - phrases: ["subject"]
          label: Time each patient spends in the study

  - id: timeline.periods
    group: timelines
    label: Timeline components
    type: object[]
    schema:
      component: enum[start_up, screening, recruitment, treatment, end_of_treatment, follow_up,
                      long_term_follow_up, database_lock, final_analysis, other]
      label: text            # the component as the document names it: "Accrual period"
      duration: text
      start: text
      end: text
    aliases: ["start-up", "recruitment period", "enrolment period", "screening period",
              "treatment period", "follow-up", "LTFU", "database lock", "DBL", "final analysis"]
    # The exclusions are fix 7 of the 2026-10-12 brief: run r-20261012-angus listed Month 1,
    # Month 2 and other single visits here, which are the visit schedule.
    hint: >
      One entry per component of the study's timeline the document states: start-up,
      enrolment (recruitment), screening, treatment, the end-of-treatment visit window,
      follow-up after the last dose, database lock, final analysis. `label` names the
      component as the document does; `duration` is how long it lasts, `start` and `end` when
      it begins and ends, each in the document's words. Leave out single visits ("Month 1",
      "Day 8") — they are the visit schedule — and the overall study duration, which is its
      own variable. Omit components not mentioned.
    source_priority: any
    budget_driver: true
    # One row, a line per component in the order of `component`'s values (fix 7).
    display:
      kind: periods
      order_key: component
      one_per: [component]
      heading: ["{label}", "{component}"]
      # The first alternative whose keys are all stated, so the longer ones come first.
      lines: ["{heading}: {duration} ({start} to {end})", "{heading}: {duration}, from {start}",
              "{heading}: {duration}, until {end}", "{heading}: {duration}",
              "{heading}: {start} to {end}", "{heading}: from {start}", "{heading}: until {end}"]
      see_also:
        - field: timeline.total_duration
          wording: "Whole study: see {label}"
          # "42 vs 40 months (Disagreement 2)", Oliver's wording of 2026-10-12.
          disagree: "Whole study: {values} (Disagreement {n})"

# --- Group 7: Blinding and Unblinded Monitoring -----------------------------
  - id: blinding.design
    group: blinding_monitoring
    label: Blinding design
    type: enum
    values: [open_label, single_blind, double_blind, triple_blind, partially_blinded, not_specified]
    value_words:
      open_label: Open-label
      single_blind: Single-blind
      double_blind: Double-blind
      triple_blind: Triple-blind
      partially_blinded: Partly blinded
    aliases: ["open-label", "single-blind", "double-blind", "double-masked", "triple-blind",
              "blinded", "unblinded study"]
    plain: >
      Who is kept from knowing which treatment a participant is on. Open-label: everyone knows.
      Double-blind: neither the participant nor the site staff does, so separate staff are needed.
    source_priority: protocol
    budget_driver: true

  - id: blinding.placebo_matching
    group: blinding_monitoring
    label: Placebo matches the study drug
    type: enum
    values: [matching_stated, not_matching_stated, not_specified]
    value_words:
      matching_stated: Matching
      not_matching_stated: Not matching
    aliases: ["matching placebo", "identical placebo", "placebo", "matched placebo",
              "placebo comparator", "visually identical"]
    hint: >
      MATCHING MEANS MATCHING AS SUPPLIED TO THE SITE, in the vial, bottle or carton the site
      receives. Text saying the prepared infusion looks identical — "the saline bag will look
      identical to the drug infusion bag" — describes the drug AFTER unblinded pharmacy staff have
      made it up, and is NOT matching: answer not_specified for that sentence alone, or
      not_matching_stated if the document also says the supplies do not match. Use
      matching_stated only where the document says the placebo as supplied matches or is identical.
      Use not_matching_stated where it says the placebo does not match or will not be provided.
      Use not_specified where the document is silent. Never infer from the route of administration
      here — that inference belongs to blinding.placebo_assumption, which is derived.
    plain: >
      Whether the dummy treatment arrives at the hospital looking the same as the real drug. If it
      does not, someone who is allowed to know which is which has to prepare it, and that person has
      to be paid for separately.
    source_priority: any
    budget_driver: true

  - id: blinding.unblinded_staff_stated
    group: blinding_monitoring
    label: Unblinded staff stated as required
    type: enum
    # `true`/`false` and not `yes`/`no`, for two reasons. YAML reads unquoted
    # `yes` and `no` as booleans, so the registry turns them into the strings
    # `true` and `false` whatever is written here. And every other yes-or-no
    # field in this file already uses `true`/`false` — design.first_in_human,
    # design.healthy_volunteers, dosing.varies_by_cohort,
    # monitoring.unblinded_required, monitoring.frequency_requested — so making
    # this one the exception would be the surprise, not the fix. The
    # blinding.placebo_assumption rubric reads this value, and
    # tests/derive/test_rubric.py asserts the registry still offers the value the
    # rubric looks for, so renaming the enum fails a test instead of quietly
    # switching the contradiction rule off.
    values: ["true", "false", not_specified]
    # Quoted for the same reason as the values: YAML would read the keys as booleans.
    value_words:
      "true": "Yes"
      "false": "No"
    aliases: ["unblinded pharmacy staff", "unblinded pharmacist", "unblinded staff",
              "unblinded site staff", "unblinded personnel"]
    # The three answers below are not interchangeable and the difference is the
    # whole point of the field. Until 2026-10-03 the hint ended "not_specified
    # where it does not say, which is the common case", and on the live run
    # r-20261003-001602-stage5b the model answered not_specified while quoting the
    # placebo sentence — a sentence that says nothing at all about staff. GATE
    # confirmed it at 0.85. A wrong answer nobody flags is worse than no answer,
    # so not_specified now has to be earned and silence has to be reported as
    # silence (status not_found), per non-negotiable rule 3 in CLAUDE.md.
    hint: >
      READ OFF THE PAGE ONLY — no inference. Answer from a sentence about who may know the
      treatment allocation or who handles unblinded drug; a sentence about anything else is not
      evidence for this field.
      "true" where the document states that unblinded staff are needed, however briefly, for
      example "access to the study drug should be strictly limited to the unblinded pharmacy
      staff" or "the Unblinded Pharmacist or their designee will prepare the dose".
      "false" only where the document states that no unblinded staff are required.
      "not_specified" ONLY where the text you were given does discuss blinding, randomisation or
      study-drug handling and still never says who may be unblinded. Do not answer
      "not_specified" to mean "this excerpt is not about that": if nothing you were given is
      about unblinded staff, return status "not_found" and no value. Never quote a sentence that
      does not mention staff, unblinding or drug handling in support of "not_specified".
      This field is deliberately narrower than monitoring.unblinded_required, which may answer
      "likely" from a trigger: this one records what the document actually says, so that
      blinding.placebo_assumption can tell a stated fact from an inference.
    plain: >
      Whether the document says in writing that staff who are allowed to know the treatment are
      needed. A separate question from whether the tool thinks they will be.
    source_priority: any
    budget_driver: true

  - id: monitoring.unblinded_required
    group: blinding_monitoring
    label: Unblinded monitoring likely required
    type: enum
    values: [yes, likely, no, not_specified]
    # Quoted: YAML reads unquoted yes and no as booleans, and the registry stores the
    # values above as "true" and "false". The block on this group prints these.
    value_words:
      "true": Needed
      likely: Likely needed
      "false": Not needed
    aliases: ["unblinded monitor", "unblinded CRA", "unblinded site staff", "unblinded pharmacist"]
    hint: >
      "yes" when the document states it directly. "likely" when the document does not say so but
      states a trigger that implies it (blinded design with site-level drug preparation, separate
      blinded/unblinded staff, IP accountability by unblinded personnel, pharmacy manual
      requirements). When answering "likely", the quote must be the trigger text, and the
      inference must be stated in `notes`. This field carries real budget weight — do not guess.
    plain: >
      Whether someone allowed to see which treatment each participant is on must visit the site. On
      a blinded study that cannot be the usual monitor, so it means paying for a second one.
    source_priority: any
    budget_driver: true

  - id: monitoring.unblinded_factors
    group: blinding_monitoring
    label: Factors driving unblinded monitoring
    type: list[enum]
    values: [blinded_vs_open_design, ip_accountability, randomisation_blinding_procedures,
             pharmacy_manual_requirements, separate_blinded_unblinded_staff,
             drug_preparation_requirements, treatment_allocation_visibility,
             sponsor_specific_requirements, protocol_or_rfp_instruction]
    source_priority: any

  - id: monitoring.unblinded_rationale
    group: blinding_monitoring
    label: Reason / trigger for unblinded monitoring
    type: text
    source_priority: any

  - id: blinding.placebo_assumption
    group: blinding_monitoring
    label: What to assume about the placebo
    type: text
    derived: true
    derived_from: [blinding.design, ip.form, blinding.placebo_matching,
                   blinding.unblinded_staff_stated]
    hint: >
      DERIVED — the rubric in derive/rubric.py applies docs/ANALYST_PROCEDURE_PROTOCOL.md section 6
      rules 1 to 4 and the rule 6 contradiction, never extracted by the model. The explanation must
      name the inputs it used.
    plain: >
      The tool's reading of whether a dummy treatment that matches the real drug can be assumed, and
      so whether separately paid unblinded staff should be priced in. No document states this: it is
      worked out from the blinding, the way the drug is given and what the document says about the
      placebo, so it is a starting point for a person to accept or overrule.
    budget_driver: true

# --- Group 8: Operational Metrics and Volumes -------------------------------
  - id: ops.sites_total
    group: operational_metrics
    label: Total number of sites
    type: int
    scoped: true
    aliases: ["number of sites", "investigative sites", "study sites", "centres", "centers",
              "number of centres", "site count"]
    hint: >
      Total planned sites. Emit country/region breakdowns as SEPARATE records with
      scope="country:DE" etc. A country subtotal is not a contradiction of the total —
      set scope correctly and the reconciler will handle it.
    source_priority: rfp
    budget_driver: true

  - id: ops.subjects_total
    group: operational_metrics
    label: Total number of patients / subjects
    type: int
    scoped: true
    aliases: ["number of subjects", "number of patients", "sample size", "planned enrolment",
              "planned enrollment", "N=", "total enrolment", "randomised subjects"]
    # The scope rules and the display are stage 5 of the 2026-10-12 plan (fix 10 of that
    # day's brief, approved by Oliver). Run r-20261012-stage4check3 scoped the arm figures
    # "cohort:NEOD001 arm", printed "per arm" as a row of its own, and put the protocol's
    # statistical sample size in a cluster with the enrolment total.
    hint: >
      Distinguish SCREENED / ENROLLED / RANDOMISED / COMPLETED — these are different numbers and
      the document may state several. Record which one it is in `notes`.
      Set `scope` on every record. The number of subjects for the whole study is
      scope="total". A number for one arm is scoped by that arm as "Cohorts / arms / dose
      levels / parts" scopes it, by what its subjects receive: scope="arm:<study drug>" or
      scope="arm:placebo", never the arm's number or group name ("Arm 1", "Group A"). A number
      stated as the same for every arm ("130 per arm") is scope="per arm". A country's figure
      is scope="country:<code>".
      A sample size the statistical analysis needs (the number of subjects or events needed to
      show an effect, from a power calculation) is not the number to be enrolled, even where
      it is close to it: give it scope="statistical minimum", never scope="total".
      Record each number only where the document states it; never add arms up to a total or
      divide a total into arms.
    source_priority: rfp
    budget_driver: true
    # One row: the total and the figure per arm in the headline, then a line per arm of
    # "Cohorts / arms / dose levels / parts", named as that row names it, and the total.
    display:
      kind: breakdown
      parts_from: design.parts
      part_line: "{part}: {value}"
      each: [per arm]
      total: [total]
      total_line: "Total: {value}"
      each_differs: "Per arm: {value} — does not agree with the arms' own figures above"
      headline:
        - "{total} ({each} per arm, {also})"
        - "{total} ({each} per arm)"
        - "{total} ({also})"
        - "{total}"
        - "{each} per arm"
        - "See the lines below"
      also:
        - field: design.allocation_ratio
          wording: "randomized {value}"

  - id: ops.crf_pages
    group: operational_metrics
    label: Number of CRF pages
    type: int
    # Scoped by stage 5 of the 2026-10-12 plan (the CRF half of fix 11 of that day's brief):
    # run r-20261012-stage4check3 gave the RFP's 80 and 20,800 no scope, so they read as two
    # answers to one question.
    scoped: true
    aliases: ["CRF pages", "eCRF pages", "unique CRF pages", "case report form pages"]
    hint: >
      Set `scope` on every record: scope="per subject" for the number of pages in one
      subject's CRF, scope="total" for the number of pages across all subjects, and
      scope="unique pages" for the number of distinct page designs. Record each number only
      where the document states it; never work one out from another.
    plain: >
      CRF means case report form — the forms a site fills in for each participant. The page count
      drives data entry, checking and database work.
    source_priority: rfp
    budget_driver: true
    display:
      kind: breakdown
      each: [per subject]
      total: [total]
      each_differs: "Per subject: {value}"
      headline:
        - "{each} per subject; {total} in total"
        - "{total} in total"
        - "{each} per subject"
        - "See the lines below"

  # The five rows below replaced `ops.monitoring_visits` ("Number of monitoring
  # visits by type") on 2026-10-07, change 5 of that day's review. That one field
  # was a list of objects, and the report printed it as
  # "75 visits total (1 per site), 750 visits total (10 per site), 300 visits
  # total (4 per site)" in run r-20261007-140411 — three numbers with nothing
  # saying which kind of visit each belongs to. `monitoring.onsite_remote_mix`
  # went at the same time: it described a split without saying which visit type
  # it was describing, so each row below carries its own split instead.
  #
  # One row per visit type, in the order the five appear here, all still in the
  # Operational Metrics and Volumes group where the field they replaced sat.
  # Each is `text`, not a number, because the row has to carry the document's own
  # wording: the sponsor may state a per-site figure, a total, a percentage of
  # sites, or that it will do the visits itself, and the pipeline must do no
  # calculation (CLAUDE.md and the review prompt both forbid it).
  - id: ops.visits_site_selection
    group: operational_metrics
    label: Site selection visits
    type: text
    aliases: ["SSV", "site selection visit", "site qualification visit",
              "pre-study visit", "PSV", "site evaluation visit"]
    hint: >
      ANSWER IN ONE ROW, IN THE DOCUMENT'S OWN WORDS. Say how many site selection visits the document states,
      copying the figure exactly as written — a number of visits, a per-site figure, or a
      percentage such as "75% of sites" — and then the sentence or table entry it came from,
      including any split between visits done on site and visits done remotely. DO NO ARITHMETIC:
      never turn a percentage into a count and never multiply a per-site figure by the number of
      sites. If the document states both a per-site figure and a total, give both as it gives them.
      THE VALUE MUST CARRY EVERY FIGURE THE DOCUMENT GIVES FOR THIS VISIT TYPE in the one table
      entry or sentence that states it: the per-site figure, the total, the hours or days on site
      per visit, and any split between visits done on site and visits done remotely. A value that
      gives the count and drops the hours has lost half of what the visit is costed from.
      QUOTE THE SHORTEST UNBROKEN RUN OF THE DOCUMENT'S OWN CHARACTERS THAT CONTAINS THE FIGURE.
      These figures usually sit in a two-column table whose label and figure are on separate lines,
      so do not join text across the two columns, do not re-order lines and do not tidy the spacing
      — a quote that is not in the text character for character is thrown away and the row is lost.
      A SHORT EXACT FRAGMENT IS BETTER THAN A LONG TIDY ONE: where you cannot reproduce the whole
      entry character for character, quote only the few words around the figure, as they appear.
      The value may read as one tidy sentence; the quote may not.
      Where the document says the sponsor will do site selection visits itself, say that in the document's own
      words. Leave the field out only where no document mentions site selection visits at all.
    plain: >
      Visits to look a site over before it is chosen — made by the sponsor's or the CRO's monitor,
      not appointments for a participant. Each one is travel, a day of a monitor's time and a
      report.
    source_priority: rfp
    budget_driver: true

