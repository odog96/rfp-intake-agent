# Facts that must hold in every run on the two sample documents.
#
#   samples/Example protocol 2.pdf      (classified as the protocol amendment)
#   samples/Synthetic_RFP_NEOD001.pdf
#
# For these two documents this file replaces the stale golden files beside it,
# Example_protocol_2.json, Synthetic_RFP_NEOD001.json and contradictions.yaml,
# which describe a different study (docs/JOURNAL.md:662, the second 2026-10-03 entry)
# and are left as they are. It is the first part of rebuilding the golden set: a
# short list of answers that are known, checked by hand against the PDFs, and
# must never regress — not an accuracy score.
#
# Read by scripts/check_must_hold.py, which checks a run's extraction.json, not
# its report.pdf:
#
#   python scripts/check_must_hold.py <run_id>
#
# After every live run on these two documents, run it. If any fact fails, do not
# commit work that depends on the run, do not report that work as done, and tell
# Oliver which fact failed (CLAUDE.md, non-negotiable rule 11).
#
# Each fact has a `kind`, which says how scripts/check_must_hold.py reads it:
#
#   one_row        the field has exactly one row, with this status and value
#   value_row      the field has a row with this scope and value, and no row of
#                  that scope gives a different value
#   arms           the arms field has exactly these arms, one row each, and the
#                  subjects field gives each arm this number of subjects
#   disagreement   a `conflict` (a Disagreement in the report) on the field, with
#                  a record for each side: from that kind of document, on that
#                  page if one is given, stating that value; with a `scope`, only
#                  a disagreement whose records have that scope (case ignored)
#   removed        a passage with this heading is among MARK_OTHER_STUDY's
#                  removals (Appendix C of the report)
#   rows_say       each listed field has a row read from that kind of document
#                  whose value states the listed amount (or says every listed word)
#   coverage       at least this many registry fields have a value
#
# A fact can name a known intermittent failure, approved by Oliver on
# 2026-10-15: one row of a `rows_say` fact may carry `known`, and a `coverage`
# fact may list `known_missing` fields. Where only that named part is missing,
# the check prints KNOWN, not PASS or FAIL, and KNOWN does not fail the run. Each
# entry names the open item in CLAUDE.md it waits on. Nothing else in the fact
# is loosened: any other row missing, or any other field without a value, still
# fails, and a `coverage` fact lowers its threshold by one only for each listed
# field that is actually missing.
#
# A side or row matches a value in one of three ways. `value` is the normalised
# value exactly (0, "phase_3", "not_matching_stated"). `amount` is a number and
# its unit, for values the model words freely: the value written out as text
# ({"n": 42, "unit": "months"} reads "42 months") must state the number directly
# followed by one of the listed units, whatever words surround them, so
# {n: 40, unit: [month, months]} matches "40 month study duration" and
# "40 months" alike, and not "140 months" (Oliver, 2026-10-17, after fact 5
# failed on r-20261016-prompt-b only because the RFP side read "40 month").
# `says` is a list of words that must each appear, as whole words, case ignored.

documents:
  - Example protocol 2.pdf
  - Synthetic_RFP_NEOD001.pdf

facts:
  - id: 1
    name: Study phase is one confirmed row, Phase 3
    kind: one_row
    field: study.phase
    status: confirmed
    value: phase_3

  - id: 2
    name: Two arms, one per treatment, each with 130 subjects
    kind: arms
    field: design.parts
    subjects_field: ops.subjects_total
    # Each arm is recognised by a word in its row's scope.
    arms:
      - {scope_says: neod001, subjects: 130}
      - {scope_says: placebo, subjects: 130}

  - id: 3
    name: Total number of subjects is 260
    kind: value_row
    field: ops.subjects_total
    scope: total
    value: 260

  - id: 4
    name: Number of interim analyses is a disagreement, 0 (amendment p.98) against 1 (RFP p.4)
    kind: disagreement
    field: interim.count
    sides:
      - {from: amendment, page: 98, value: 0}
      - {from: rfp, page: 4, value: 1}

  - id: 5
    name: Overall study duration, whole study, is a disagreement, 42 months (amendment) against 40 (RFP)
    kind: disagreement
    field: timeline.total_duration
    scope: study
    sides:
      - {from: amendment, amount: {n: 42, unit: [month, months]}}
      - {from: rfp, amount: {n: 40, unit: [month, months]}}

  - id: 6
    name: Placebo matches the study drug is a disagreement, not matching (amendment p.53) against matching (RFP p.3)
    kind: disagreement
    field: blinding.placebo_matching
    sides:
      - {from: amendment, page: 53, value: not_matching_stated}
      - {from: rfp, page: 3, value: matching_stated}

  - id: 7
    name: Section 1.3.2 "Clinical Experience" is among the removed passages (Appendix C)
    kind: removed
    heading: 1.3.2 Clinical Experience

  - id: 8
    name: The five monitoring-visit rows hold the RFP's figures
    kind: rows_say
    rows:
      - field: ops.visits_site_selection
        from: rfp
        amount: {n: 80, unit: [visit, visits]}
        # RFP p.3 prints this value in a two-column table, with the label
        # "Time on Site" between its lines, so the model's quote is sometimes
        # not word for word in the page text and is rejected
        # (quote_not_found_in_excerpt). Missing in r-20261013-prompt-c, found
        # in r-20261012-angus2.
        known: "CLAUDE.md open item 1, the two-column table on RFP p.3"
      - {field: ops.visits_site_initiation, from: rfp, amount: {n: 75, unit: [visit, visits]}}
      - {field: ops.visits_interim_monitoring, from: rfp, amount: {n: 750, unit: [visit, visits]}}
      - {field: ops.visits_close_out, from: rfp, amount: {n: 75, unit: [visit, visits]}}
      - {field: ops.visits_pharmacy_monitoring, from: rfp, amount: {n: 300, unit: [visit, visits]}}

  - id: 9
    name: At least 40 of the registry's fields have a value
    kind: coverage
    at_least: 40
    # The same known failure as fact 8: when this field has no value the
    # threshold is 39, never lower.
    known_missing:
      - {field: ops.visits_site_selection, known: "CLAUDE.md open item 1, the two-column table on RFP p.3"}
